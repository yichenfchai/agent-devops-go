<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660"><defs><marker id="a0" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;}</style><rect width="1240" height="660" fill="#ffffff"/><text x="620" y="36" font-size="20" text-anchor="middle" font-weight="700" fill="#0f172a">图 3-4  Go 并发模型与 goroutine 拓扑</text><rect x="520" y="50" width="200" height="54" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/><text x="620" y="74" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">main</text><text x="620" y="93" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">装配依赖 · 启动 · 优雅关闭</text><line x1="620" y1="104" x2="160" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#a5)"/><rect x="70" y="150" width="180" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="160" y="174" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">Scheduler</text><text x="160" y="193" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">× 1</text><line x1="620" y1="104" x2="430" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#a5)"/><rect x="300" y="150" width="260" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="430" y="174" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">Worker Pool</text><text x="430" y="193" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">信号量限流 × N</text><line x1="620" y1="104" x2="710" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#a5)"/><rect x="610" y="150" width="200" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="710" y="174" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">HTTP Server</text><text x="710" y="193" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">每请求一个</text><line x1="620" y1="104" x2="945" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#a5)"/><rect x="860" y="150" width="170" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="945" y="174" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">Reconciler</text><text x="945" y="193" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">× 1</text><line x1="620" y1="104" x2="1150" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#a5)"/><rect x="1080" y="150" width="140" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="1150" y="174" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">Signal</text><text x="1150" y="193" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">SIGTERM</text><line x1="430" y1="206" x2="430" y2="250" stroke="#047857" stroke-width="1.4" marker-end="url(#a2)" stroke-dasharray="5,4"/><line x1="710" y1="206" x2="1015" y2="250" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#a1)" stroke-dasharray="5,4"/><rect x="60" y="250" width="740" height="260" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="82" y="274" font-size="12.5" text-anchor="start" font-weight="700" fill="#047857">Worker Pool 展开 —— 每个构建一组 goroutine</text><rect x="80" y="290" width="700" height="200" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6" stroke-dasharray="5,4"/><text x="96" y="310" font-size="11.5" text-anchor="start" font-weight="400" fill="#047857">per-build goroutine</text><rect x="95" y="325" width="155" height="145" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="172.5" y="352" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">Builder</text><text x="172.5" y="378" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">Docker 构建</text><text x="172.5" y="404" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">容器隔离执行</text><text x="172.5" y="430" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">ctx 超时取消</text><rect x="265" y="325" width="155" height="145" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="342.5" y="352" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">Log Reader</text><text x="342.5" y="378" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">读取容器日志</text><text x="342.5" y="404" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">→ LogPipe</text><text x="342.5" y="430" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">逐行打时间戳</text><rect x="435" y="325" width="155" height="145" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="512.5" y="352" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">Log Writer</text><text x="512.5" y="378" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">批量落库</text><text x="512.5" y="404" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">ring buffer</text><text x="512.5" y="430" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">慢订阅者丢弃</text><rect x="605" y="325" width="155" height="145" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="682.5" y="352" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">Diagnoser</text><text x="682.5" y="378" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">失败时异步</text><text x="682.5" y="404" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">调 LLM API</text><text x="682.5" y="430" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">脱敏 + 重试</text><rect x="830" y="250" width="370" height="260" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="852" y="274" font-size="12.5" text-anchor="start" font-weight="700" fill="#1d4ed8">HTTP Server 展开</text><rect x="850" y="295" width="330" height="95" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/><text x="1015" y="322" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">API / Webhook goroutine</text><text x="1015" y="344" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">ctx 贯穿下游 · 客户端断开即取消</text><text x="1015" y="366" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">webhook 只入队，立即返回 202</text><rect x="850" y="405" width="330" height="90" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/><text x="1015" y="432" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">SSE 订阅 goroutine</text><text x="1015" y="454" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">订阅 LogPipe 写入响应</text><text x="1015" y="476" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">慢客户端丢弃，绝不阻塞管道</text><rect x="60" y="540" width="1140" height="96" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="80" y="566" font-size="11.5" text-anchor="start" font-weight="400" fill="#0f172a">■ 每个 goroutine 必须有明确退出路径（channel 关闭或 ctx 取消）—— 泄漏 goroutine 即内存泄漏</text><text x="80" y="590" font-size="11.5" text-anchor="start" font-weight="400" fill="#0f172a">■ 限流用 chan struct{} 信号量实现；背压天然形成：队列满 → webhook 503 → 平台自动重试</text><text x="80" y="614" font-size="11.5" text-anchor="start" font-weight="400" fill="#64748b">■ 清理逻辑必须用 context.WithoutCancel，否则 ctx 取消后容器 / SSH 连接会泄漏</text></svg>