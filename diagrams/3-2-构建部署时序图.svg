ke-width="1.2" stroke-dasharray="4,5"/><rect x="213" y="60" width="144" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="285" y="82" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">Access 层</text><text x="285" y="100" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">Webhook / API</text><line x1="285" y1="112" x2="285" y2="800" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,5"/><rect x="368" y="60" width="144" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="440" y="82" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">Scheduler</text><text x="440" y="100" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">队列 · 状态机</text><line x1="440" y1="112" x2="440" y2="800" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,5"/><rect x="523" y="60" width="144" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="595" y="82" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">Worker</text><text x="595" y="100" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">构建/部署编排</text><line x1="595" y1="112" x2="595" y2="800" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,5"/><rect x="678" y="60" width="144" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="750" y="82" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">Docker</text><text x="750" y="100" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">本机构建容器</text><line x1="750" y1="112" x2="750" y2="800" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,5"/><rect x="833" y="60" width="144" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="905" y="82" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">目标主机</text><text x="905" y="100" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">Docker + 应用</text><line x1="905" y1="112" x2="905" y2="800" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,5"/><rect x="988" y="60" width="144" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="1060" y="82" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">LLM API</text><text x="1060" y="100" font-size="10.5" text-anchor="middle" font-weight="400" fill="#64748b">OpenAI 兼容</text><line x1="1060" y1="112" x2="1060" y2="800" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,5"/><line x1="130" y1="160" x2="285" y2="160" stroke="#64748b" stroke-width="1.8" marker-end="url(#a0)"/><text x="207.5" y="152" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">① push webhook 事件</text><line x1="285" y1="208" x2="440" y2="208" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#a1)"/><text x="362.5" y="200" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">② HMAC 验签通过 → 生成 BuildRequest 入队</text><line x1="285" y1="256" x2="130" y2="256" stroke="#64748b" stroke-width="1.8" marker-end="url(#a0)" stroke-dasharray="5,4"/><text x="207.5" y="248" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">③ 202 Accepted（立即返回，不阻塞）</text><line x1="440" y1="312" x2="595" y2="312" stroke="#047857" stroke-width="1.8" marker-end="url(#a2)"/><text x="517.5" y="304" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">④ 原子认领任务，获取信号量槽位</text><path d="M 595 340 L 655 340 L 655 366 L 595 366" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#a2)"/><text x="640" y="332" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">⑤ 检测项目类型 → 生成 Pipeline 快照</text><line x1="595" y1="410" x2="750" y2="410" stroke="#64748b" stroke-width="1.8" marker-end="url(#a0)"/><text x="672.5" y="402" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">⑥ 创建容器并执行构建步骤</text><line x1="750" y1="458" x2="595" y2="458" stroke="#64748b" stroke-width="1.8" marker-end="url(#a0)" stroke-dasharray="5,4"/><text x="672.5" y="450" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">⑦ 日志流 stdout / stderr</text><line x1="595" y1="506" x2="1060" y2="506" stroke="#b45309" stroke-width="1.8" marker-end="url(#a3)" stroke-dasharray="5,4"/><text x="827.5" y="498" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">⑧ 构建失败：提交日志尾部（已脱敏）</text><line x1="1060" y1="554" x2="595" y2="554" stroke="#b45309" stroke-width="1.8" marker-end="url(#a3)" stroke-dasharray="5,4"/><text x="827.5" y="546" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">⑨ 诊断建议（异步，不阻塞状态流转）</text><line x1="595" y1="602" x2="905" y2="602" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a4)"/><text x="750" y="594" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">⑩ SSH: docker-compose up -d 新镜像</text><line x1="905" y1="650" x2="595" y2="650" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a4)" stroke-dasharray="5,4"/><text x="750" y="642" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">⑪ 健康检查结果</text><line x1="595" y1="698" x2="905" y2="698" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a4)" stroke-dasharray="5,4"/><text x="750" y="690" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">⑫ 健康检查失败 → 回滚上一版本</text><line x1="595" y1="746" x2="440" y2="746" stroke="#047857" stroke-width="1.8" marker-end="url(#a2)"/><text x="517.5" y="738" font-size="11.5" text-anchor="middle" font-weight="400" fill="#0f172a">⑬ 状态落地 → DB（deployed / rolled_back）</text><rect x="60" y="820" width="1120" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="80" y="845" font-size="11.5" text-anchor="start" font-weight="400" fill="#0f172a">实线：请求 / 指令流　　虚线：响应 / 条件分支流</text><text x="80" y="868" font-size="11" text-anchor="start" font-weight="400" fill="#64748b">③ 立即返回 202 是设计关键：webhook 不做构建，避免超时引发平台重试风暴　·　⑤ Pipeline 以快照写入 builds.pipeline_json，保证历史构建可复现</text></svg>