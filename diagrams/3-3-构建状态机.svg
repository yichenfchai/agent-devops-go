<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 540" width="1240" height="540"><defs><marker id="a0" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;}</style><rect width="1240" height="540" fill="#ffffff"/><text x="620" y="36" font-size="20" text-anchor="middle" font-weight="700" fill="#0f172a">图 3-3  构建与部署状态机</text><rect x="60" y="110" width="140" height="58" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><text x="130" y="145" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">queued</text><rect x="300" y="110" width="140" height="58" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="370" y="145" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">running</text><rect x="540" y="110" width="140" height="58" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="610" y="145" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">succeeded</text><rect x="780" y="110" width="140" height="58" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="850" y="145" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">deploying</text><rect x="1020" y="110" width="140" height="58" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="1090" y="145" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">deployed</text><rect x="300" y="300" width="140" height="58" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/><text x="370" y="335" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">failed</text><rect x="780" y="300" width="140" height="58" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/><text x="850" y="335" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">deploy_failed</text><rect x="1020" y="300" width="140" height="58" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="1090" y="335" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">rolled_back</text><rect x="60" y="300" width="140" height="58" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6" stroke-dasharray="5,4"/><text x="130" y="335" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">diagnosed</text><line x1="200" y1="139" x2="300" y2="139" stroke="#475569" stroke-width="1.8" marker-end="url(#a5)"/><text x="250" y="130" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">认领</text><line x1="440" y1="139" x2="540" y2="139" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#a1)"/><text x="490" y="130" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">构建成功</text><line x1="680" y1="139" x2="780" y2="139" stroke="#047857" stroke-width="1.8" marker-end="url(#a2)"/><text x="730" y="130" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">触发部署</text><line x1="920" y1="139" x2="1020" y2="139" stroke="#047857" stroke-width="1.8" marker-end="url(#a2)"/><text x="970" y="130" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">健康检查通过</text><line x1="370" y1="168" x2="370" y2="300" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a4)"/><text x="380" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">构建失败</text><line x1="850" y1="168" x2="850" y2="300" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a4)"/><text x="860" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">部署失败</text><line x1="920" y1="329" x2="1020" y2="329" stroke="#b45309" stroke-width="1.8" marker-end="url(#a3)"/><text x="970" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">自动回滚</text><line x1="1090" y1="168" x2="1090" y2="300" stroke="#b45309" stroke-width="1.8" marker-end="url(#a3)"/><text x="1078" y="240" font-size="11" text-anchor="end" font-weight="400" fill="#64748b">手动回滚</text><path d="M 300 329 L 200 329" fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#a6)"/><text x="250" y="314" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">异步诊断</text><rect x="40" y="410" width="1160" height="100" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="60" y="436" font-size="11.5" text-anchor="start" font-weight="400" fill="#0f172a">■ 主干流：queued → running → succeeded → deploying → deployed；失败分支：failed、deploy_failed → rolled_back</text><text x="60" y="460" font-size="11.5" text-anchor="start" font-weight="400" fill="#0f172a">■ 状态迁移逐条校验，非法迁移直接拒绝；每次迁移写入 build_events，支持构建时序回放与审计</text><text x="60" y="484" font-size="11.5" text-anchor="start" font-weight="400" fill="#64748b">■ diagnosed 为异步标记位，不参与主干状态机；LLM 诊断失败不影响构建结果</text></svg>